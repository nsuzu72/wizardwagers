<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WZRDWAGERS | The Arena</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#3b82f6;
  --gold:#fbbf24;
  --border:#26262b;
  --bg:#0a0a0b;
  --card-bg:#161618;
  --hover:#1f1f23;
  --text-main:#f8fafc;
  --text-sub:#8b8b93;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:var(--bg);margin:0;color:var(--text-main);overflow-x:hidden;letter-spacing:-0.2px}
h1,h2,h3{font-family:'Inter',sans-serif;font-weight:700;letter-spacing:-0.5px;margin:0}
.container{max-width:1100px;margin:24px auto;padding:0 16px}
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999}
.heartbeat{width:200px;animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

nav{border-bottom:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(10,10,11,.85);backdrop-filter:blur(12px);z-index:100}
nav img{height:28px}
.btn-p{background:var(--blue);border:none;padding:10px 18px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;min-height:38px;color:white;transition:0.2s}
.btn-p:hover{background:#2563eb}
.btn-s{background:var(--hover);border:1px solid var(--border);padding:10px 18px;border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;min-height:38px;color:var(--text-main);transition:0.2s}
.btn-s:hover{background:#2a2a2e}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.stat-box{padding:16px;border-radius:12px;background:var(--card-bg);border:1px solid var(--border);text-align:left}

.market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color 0.2s ease}
.card:hover{border-color:#3a3a3e}
.matchup{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--border)}
.team{display:flex;flex-direction:row;align-items:center;gap:10px;width:45%}
.team img{width:28px;height:28px;border-radius:50%}
.team span{font-size:14px;font-weight:600;text-align:center}
.vs{font-size:11px;color:var(--text-sub);font-weight:600;background:var(--hover);padding:4px 8px;border-radius:4px}
.card-content{padding:16px}
.bet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.bet-btn{padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--hover);color:var(--text-main);font-weight:600;cursor:pointer;text-align:center;transition:.2s}
.bet-btn:hover{border-color:var(--blue);background:#202024}
.bet-btn span{display:block;font-size:10px;color:var(--text-sub);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
.bet-btn b{font-size:14px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:var(--card-bg);width:100%;max-width:480px;border-radius:12px;padding:24px;border:1px solid var(--border);animation:fadeIn .2s ease;max-height:90vh;overflow-y:auto}
@keyframes fadeIn{from{opacity:0;transform:scale(0.98)}to{opacity:1;transform:scale(1)}}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid var(--border);background:#0f0f11;color:var(--text-main);font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:0.2s}
input:focus,select:focus{border-color:var(--blue)}
label{display:block;margin:4px 0;font-size:12px;color:var(--text-sub)}
.hidden{display:none!important}
.winner-glow{border:2px solid var(--gold)!important;box-shadow:0 0 20px rgba(251,191,36,.2)}

#auth-screen{max-width:400px;margin:0 auto}
@media(max-width:768px){
  .market-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="loader">
  <img src="logo.png" class="heartbeat">
  <p style="font-family:'Inter';color:var(--text-sub);margin-top:20px;font-size:13px;letter-spacing:1px;text-transform:uppercase;">Summoning Arena...</p>
</div>

<nav id="navbar" class="hidden">
  <img src="logo.png">
  <div style="display:flex;align-items:center;gap:16px;">
    <span id="user-display" style="font-weight:600;color:var(--text-main);font-size:13px;"></span>
    <span id="token-display" style="font-weight:600;color:var(--gold);font-size:12px;background:rgba(251,191,36,0.1);padding:5px 10px;border-radius:6px;">0 Tokens</span>
    <button class="btn-s" onclick="openRedeemModal()">REDEEM</button>
    <button class="btn-s" onclick="logout()">LOGOUT</button>
    <button id="admin-btn" class="btn-p hidden" onclick="openAdminPanel()">ADMIN</button>
  </div>
</nav>

<div id="auth-screen" class="container hidden" style="text-align:center;padding-top:10vh;">
  <img src="logo.png" style="height:60px;margin-bottom:1.5rem;">
  <h2 style="font-size:28px;margin-bottom:8px;">WZRDWAGERS</h2>
  <p style="color:var(--text-sub);margin-bottom:2rem;font-size:14px;">Sign up to receive 10 free tokens.</p>
  <div style="display:flex;flex-direction:column;gap:10px;">
    <input type="email" id="email-input" placeholder="Email address">
    <input type="password" id="pass-input" placeholder="Password">
    <button class="btn-p" style="margin-top:8px;" onclick="emailSignup()">ENTER WITH EMAIL</button>
    <button class="btn-s" onclick="googleLogin()">ENTER WITH GOOGLE</button>
  </div>
</div>

<main id="main-content" class="container hidden">
  <div class="stats-grid">
    <div class="stat-box">
      <div style="font-size:11px;color:var(--text-sub);text-transform:uppercase;letter-spacing:0.5px;">Your Action</div>
      <div id="user-bets-count" style="font-size:24px;font-weight:700;color:var(--blue);margin-top:4px;">0</div>
    </div>
    <div class="stat-box">
      <div style="font-size:11px;color:var(--text-sub);text-transform:uppercase;letter-spacing:0.5px;">Open Markets</div>
      <div id="open-markets-count" style="font-size:24px;font-weight:700;color:var(--gold);margin-top:4px;">0</div>
    </div>
  </div>
  <div id="market-list" class="market-grid"></div>
</main>

<!-- Bet Modal -->
<div id="bet-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3 style="font-size:20px;margin-bottom:8px;">Place Wager</h3>
    <p style="font-size:12px;color:var(--text-sub);margin-bottom:12px;">Current Odds: <span id="bet-odds" style="color:var(--blue);font-weight:600;"></span></p>
    <label>Token Amount</label>
    <input type="number" id="bet-amount" placeholder="0">
    <div style="background:var(--hover);padding:12px;border-radius:8px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;color:var(--text-sub)">Potential Payout</span>
      <span id="bet-payout" style="font-size:16px;font-weight:700;color:var(--gold)">0</span>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn-p" style="flex:2" onclick="confirmBet()">CONFIRM WAGER</button>
      <button class="btn-s" style="flex:1" onclick="closeBetModal()">CANCEL</button>
    </div>
  </div>
</div>

<!-- Redeem Modal -->
<div id="redeem-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3 style="font-size:20px;margin-bottom:8px;">Redeem Code</h3>
    <label>Enter Code</label>
    <input type="text" id="code-input" placeholder="e.g., WIZARDFREE25">
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn-p" style="flex:2" onclick="redeemCode()">REDEEM</button>
      <button class="btn-s" style="flex:1" onclick="closeRedeemModal()">CANCEL</button>
    </div>
  </div>
</div>

<!-- Admin Modal -->
<div id="admin-modal" class="modal-overlay hidden">
  <div class="modal">
    <h3 style="font-size:20px;margin-bottom:16px;">Admin Panel</h3>
    <div id="admin-create" style="margin-bottom:24px;">
      <h4 style="color:var(--blue);font-size:14px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;">Create Game</h4>
      <label>Opponent Name</label>
      <input type="text" id="admin-opp" placeholder="e.g., Monroe">
      <label>Over/Under Line</label>
      <input type="number" id="admin-ou" placeholder="e.g., 45.5">
      <label>WZRD Win Probability (1-99%)</label>
      <input type="number" id="admin-wzrd-prob" placeholder="60" value="60">
      <button class="btn-p" style="width:100%;margin-top:12px;" onclick="createGame()">DEPLOY GAME</button>
    </div>
    <div id="admin-settle" style="border-top:1px solid var(--border);padding-top:24px;">
      <h4 style="color:var(--gold);font-size:14px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;">Settle Game</h4>
      <label>Select Game</label>
      <select id="admin-settle-select"></select>
      <label>Winner</label>
      <select id="admin-winner-select">
        <option value="WZRD">WZRD Won</option>
        <option value="OPP">Opponent Won</option>
      </select>
      <label>Over/Under Result</label>
      <select id="admin-ou-select">
        <option value="Over">Over Hit</option>
        <option value="Under">Under Hit</option>
      </select>
      <button class="btn-p" style="background:var(--gold);color:#000;width:100%;margin-top:12px;" onclick="settleGame()">SETTLE & PAYOUT</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, query, where, onSnapshot, getDocs, writeBatch, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyAQvmIKioJzKfHZNsoVnYbqR0-X49F2PEk",
  authDomain:"wzrdwages.firebaseapp.com",
  projectId:"wzrdwages",
  storageBucket:"wzrdwages.firebasestorage.app",
  messagingSenderId:"714039887526",
  appId:"1:714039887526:web:e3db8856fe1370192a5667"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let currentUserData = null;
let selectedBet = null;
let currentGames = [];

// --- AUTH ---
window.googleLogin = () => signInWithPopup(auth, provider).catch(e => alert(e.message));
window.emailSignup = () => {
  const email = document.getElementById('email-input').value;
  const pass = document.getElementById('pass-input').value;
  createUserWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message));
};
window.logout = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const userRef = doc(db, 'users', user.uid);
    const userSnap = await getDoc(userRef);
    if (!userSnap.exists()) {
      await setDoc(userRef, {
        tokens: 10,
        isAdmin: false,
        displayName: user.email.split('@')[0],
        redeemedCodes: []
      });
    }
    listenToUserData();
  } else {
    currentUser = null;
    document.getElementById('auth-screen').classList.remove('hidden');
    document.getElementById('navbar').classList.add('hidden');
    document.getElementById('main-content').classList.add('hidden');
    document.getElementById('loader').classList.add('hidden');
  }
});

function listenToUserData() {
  if (!currentUser) return;
  const userRef = doc(db, 'users', currentUser.uid);
  onSnapshot(userRef, (doc) => {
    currentUserData = doc.data();
    document.getElementById('navbar').classList.remove('hidden');
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('main-content').classList.remove('hidden');
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('user-display').innerText = "@" + currentUserData.displayName;
    document.getElementById('token-display').innerText = currentUserData.tokens + " Tokens";

    if (currentUserData.isAdmin) {
      document.getElementById('admin-btn').classList.remove('hidden');
    }
  });
}

// --- MARKETS ---
const gamesRef = collection(db, 'games');
const q = query(gamesRef, where("status", "==", "open"));
onSnapshot(q, (snapshot) => {
  currentGames = [];
  document.getElementById('open-markets-count').innerText = snapshot.size;
  const list = document.getElementById('market-list');
  list.innerHTML = '';

  if (snapshot.empty) {
    list.innerHTML = '<p style="color:var(--text-sub);text-align:center;grid-column:1/-1;padding:40px;">No open markets. Check back soon.</p>';
  }

  snapshot.forEach(doc => {
    const game = doc.data();
    game.id = doc.id;
    currentGames.push(game);

    // Calculate Odds
    const totalWZRD = (game.ghostWzrd || 0) + (game.pool?.WZRD || 0);
    const totalOPP = (game.ghostOpp || 0) + (game.pool?.OPP || 0);
    const totalAll = totalWZRD + totalOPP; 

    const wzrdOdds = totalAll > 0 ? ((totalWZRD / totalAll) * 100).toFixed(0) : 50;
    const oppOdds = totalAll > 0 ? ((totalOPP / totalAll) * 100).toFixed(0) : 50;

    list.innerHTML += `
    <div class="card">
      <div class="matchup">
        <div class="team">
          <img src="logo.png">
          <span>WZRD</span>
        </div>
        <div class="vs">VS</div>
        <div class="team" style="justify-content:flex-end;">
          <span>${game.opponent}</span>
          <img src="https://via.placeholder.com/28/1f1f23/8b8b93?text=OPP">
        </div>
      </div>
      <div class="card-content">
        <div style="font-size:11px;color:var(--text-sub);margin-bottom:12px;text-align:center;text-transform:uppercase;letter-spacing:0.5px;">Over/Under <b style="color:white;font-weight:700;margin-left:4px;">${game.overUnder}</b></div>
        <div class="bet-grid">
          <div class="bet-btn" onclick="openBetModal('${game.id}','WZRD')"><span>WIN (${wzrdOdds}%)</span><b>WZRD</b></div>
          <div class="bet-btn" onclick="openBetModal('${game.id}','OPP')"><span>WIN (${oppOdds}%)</span><b>OPP</b></div>
          <div class="bet-btn" onclick="openBetModal('${game.id}','Over')"><span>TOTAL</span><b>OVER</b></div>
          <div class="bet-btn" onclick="openBetModal('${game.id}','Under')"><span>TOTAL</span><b>UNDER</b></div>
        </div>
      </div>
    </div>
    `;
  });
});

// --- BETTING ---
window.openBetModal = (gameId, type) => {
  selectedBet = { gameId, type };
  const game = currentGames.find(g => g.id === gameId);
  document.getElementById('bet-modal-title').innerText = `Wager: ${type}`;

  // Calculate implied odds for display
  const totalWZRD = (game.ghostWzrd || 0) + (game.pool?.WZRD || 0);
  const totalOPP = (game.ghostOpp || 0) + (game.pool?.OPP || 0);
  const totalOver = (game.ghostOver || 0) + (game.pool?.Over || 0);
  const totalUnder = (game.ghostUnder || 0) + (game.pool?.Under || 0);

  let impliedProb = 50;
  if (type === 'WZRD') impliedProb = (totalWZRD / (totalWZRD + totalOPP)) * 100;
  if (type === 'OPP') impliedProb = (totalOPP / (totalWZRD + totalOPP)) * 100;
  if (type === 'Over') impliedProb = (totalOver / (totalOver + totalUnder)) * 100;
  if (type === 'Under') impliedProb = (totalUnder / (totalOver + totalUnder)) * 100;

  document.getElementById('bet-odds').innerText = `${impliedProb.toFixed(0)}% implied probability`;
  document.getElementById('bet-modal').classList.remove('hidden');
};

document.getElementById('bet-amount').addEventListener('input', (e) => {
  const val = parseInt(e.target.value) || 0;
  document.getElementById('bet-payout').innerText = (val * 2).toFixed(0); 
});

window.closeBetModal = () => document.getElementById('bet-modal').classList.add('hidden');

window.confirmBet = async () => {
  const amount = parseInt(document.getElementById('bet-amount').value);
  if (!amount || amount <= 0) return alert("Enter a valid amount.");
  if (amount > currentUserData.tokens) return alert("Not enough tokens.");

  const batch = writeBatch(db);

  // 1. Deduct tokens from user
  const userRef = doc(db, 'users', currentUser.uid);
  batch.update(userRef, { tokens: currentUserData.tokens - amount });

  // 2. Add bet to bets collection
  const betRef = doc(collection(db, 'bets'));
  batch.set(betRef, {
    userId: currentUser.uid,
    gameId: selectedBet.gameId,
    type: selectedBet.type,
    amount: amount,
    paid: false,
    timestamp: Date.now()
  });

  // 3. Add to game pool
  const gameRef = doc(db, 'games', selectedBet.gameId);
  const game = currentGames.find(g => g.id === selectedBet.gameId);
  const currentPool = game.pool || { WZRD:0, OPP:0, Over:0, Under:0 };
  currentPool[selectedBet.type] = (currentPool[selectedBet.type] || 0) + amount;
  batch.update(gameRef, { pool: currentPool });

  await batch.commit();
  closeBetModal();
  document.getElementById('bet-amount').value = '';
  alert("Wager placed!");
};

// --- REDEEM ---
window.openRedeemModal = () => document.getElementById('redeem-modal').classList.remove('hidden');
window.closeRedeemModal = () => document.getElementById('redeem-modal').classList.add('hidden');

window.redeemCode = async () => {
  const code = document.getElementById('code-input').value.trim();
  const validCodes = { "WIZARDFREE25": 25, "SUPERTOKENS": 10, "RECOVERME": 10 };
  if (!validCodes[code]) return alert("Invalid code.");
  if (currentUserData.redeemedCodes?.includes(code)) return alert("Already redeemed.");

  const userRef = doc(db, 'users', currentUser.uid);
  await updateDoc(userRef, {
    tokens: currentUserData.tokens + validCodes[code],
    redeemedCodes: [...(currentUserData.redeemedCodes || []), code]
  });
  closeRedeemModal();
  alert(`Redeemed ${validCodes[code]} tokens!`);
};

// --- ADMIN ---
window.openAdminPanel = () => {
  const settleSelect = document.getElementById('admin-settle-select');
  settleSelect.innerHTML = '<option value="">Select Game...</option>';
  currentGames.forEach(g => {
    settleSelect.innerHTML += `<option value="${g.id}">WZRD vs ${g.opponent}</option>`;
  });
  document.getElementById('admin-modal').classList.remove('hidden');
};

window.createGame = async () => {
  const opp = document.getElementById('admin-opp').value;
  const ou = parseFloat(document.getElementById('admin-ou').value);
  const wzrdProb = parseInt(document.getElementById('admin-wzrd-prob').value);

  if (!opp || !ou || !wzrdProb) return alert("Fill all fields.");

  // Ghost pool logic
  const ghostWzrd = wzrdProb;
  const ghostOpp = 100 - wzrdProb;
  const ghostOver = 50;
  const ghostUnder = 50;

  await addDoc(collection(db, 'games'), {
    opponent: opp,
    overUnder: ou,
    status: 'open',
    winner: null,
    ouResult: null,
    pool: { WZRD: 0, OPP: 0, Over: 0, Under: 0 },
    ghostWzrd, ghostOpp, ghostOver, ghostUnder,
    createdAt: Date.now()
  });
  alert("Game deployed!");
  document.getElementById('admin-opp').value = '';
  document.getElementById('admin-ou').value = '';
};

window.settleGame = async () => {
  const gameId = document.getElementById('admin-settle-select').value;
  if (!gameId) return alert("Select a game.");
  const winner = document.getElementById('admin-winner-select').value;
  const ouResult = document.getElementById('admin-ou-select').value;

  const game = currentGames.find(g => g.id === gameId);
  const betsQuery = query(collection(db, 'bets'), where("gameId", "==", gameId));
  const betsSnap = await getDocs(betsQuery);

  // Calculate winning pools
  const totalWinningPool = (game.pool[winner] || 0) + (game.pool[ouResult] || 0);
  if (totalWinningPool === 0) {
    await updateDoc(doc(db, 'games', gameId), { status: 'settled', winner, ouResult });
    return alert("Game settled. No winning bets.");
  }

  const batch = writeBatch(db);

  // Pay out winners
  betsSnap.forEach(docSnap => {
    const bet = docSnap.data();
    if ((bet.type === winner || bet.type === ouResult) && !bet.paid) {
      const userRef = doc(db, 'users', bet.userId);
      batch.update(userRef, { tokens: increment(bet.amount * 2) });
      batch.update(docSnap.ref, { paid: true });
    }
  });

  batch.update(doc(db, 'games', gameId), { status: 'settled', winner, ouResult });
  await batch.commit();
  alert("Game settled and payouts distributed!");
};
</script>
</body>
</html>
